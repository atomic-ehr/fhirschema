suite: 'modifierExtension must-understand (fs1102)'
# A system MUST understand every modifierExtension. "Understanding" is
# DECLARATIVE — the system lists the modifier-extension URLs it implements in
# `systemContext.settings.understoodModifierExtensions` — NOT "the URL resolves"
# (resolving a definition doesn't mean the system implements its meaning).
# The check is opt-in via `errorOnUnknownModifierExtension` (default off).

defaults:
  useR4: true

tests:
  - desc: 'by default an unknown modifierExtension is NOT an error (resolving != understanding)'
    schemas: []
    data:
      resourceType: Patient
      modifierExtension:
        - url: 'http://example.com/unknown-modifier'
    valid: true

  - desc: 'with the flag on, a modifierExtension in the understood list is valid'
    settings:
      errorOnUnknownModifierExtension: true
      understoodModifierExtensions: ['http://hl7.org/fhir/StructureDefinition/patient-animal']
    schemas: []
    data:
      resourceType: Patient
      modifierExtension:
        - url: 'http://hl7.org/fhir/StructureDefinition/patient-animal'
          extension:
            - url: species
              valueCodeableConcept: { coding: [{ code: dog }] }
    valid: true

  - desc: 'with the flag on, a modifierExtension not in the understood list → fs1102'
    settings:
      errorOnUnknownModifierExtension: true
      understoodModifierExtensions: ['http://hl7.org/fhir/StructureDefinition/patient-animal']
    schemas: []
    data:
      resourceType: Patient
      modifierExtension:
        - url: 'http://example.com/unknown-modifier'
    issues:
      - { code: fs1102, path: [modifierExtension, 0] }

  - desc: 'a regular extension with an unknown URL is not an error (opportunistic; warns only)'
    schemas: []
    data:
      resourceType: Patient
      extension:
        - url: 'http://example.com/unknown-extension'
    valid: true
